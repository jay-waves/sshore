# Build Linux/Windows amd64 on pushes and PRs; publish main after both builds.
# Full validation runs separately via the manually triggered Tests workflow.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
        goarch: [amd64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build and package
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          binary=sshore
          if [[ "$GOOS" == windows ]]; then binary=sshore.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o "dist/$binary" .
          python3 scripts/package.py --binary "dist/$binary" --version "$version" --os "$GOOS" --arch "$GOARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: sshore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sshore-*
          path: packages
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh
