# Validate formatting, vet, and native race tests on Linux and Windows; Linux
# additionally runs isolated OpenSSH/PTY end-to-end tests. Build two targets
# with CGO disabled and package executable, README, SECURITY, and MIT license.
# PRs and non-main branches only test/build. Main publishes a versioned
# release after every test/build succeeds; scripts/release.sh documents semantics.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - name: Tests with race detector
        run: go test -race -count=1 -timeout=5m ./...
      - name: Build
        run: go build -o dist/ .
      - name: CLI smoke tests
        shell: bash
        run: |
          ./dist/sshore --version
          ./dist/sshore --help
          ./dist/sshore help download
      - name: Installer tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          python3 tests/install_test.py
          python3 tests/release_test.py
      - name: Installer tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/install_windows_test.ps1
      - name: Installer tests (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install_windows_test.ps1
      - name: Real SSH integration (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          go build -tags=sshoretest -o dist/sshore-e2e .
          python3 tests/ssh_e2e.py --binary dist/sshore-e2e

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
        goarch: [amd64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build and package
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          binary=sshore
          if [[ "$GOOS" == windows ]]; then binary=sshore.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o "dist/$binary" .
          python3 scripts/package.py --binary "dist/$binary" --version "$version" --os "$GOOS" --arch "$GOARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: sshore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sshore-*
          path: packages
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh
