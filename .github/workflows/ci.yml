# Build Linux/Windows amd64 on pushes and PRs; publish main after both builds.
# Full validation is available separately through the manual Tests workflow.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (Linux + Windows amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build and package
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          for target in linux windows; do
            binary=sshore
            if [[ "$target" == windows ]]; then binary=sshore.exe; fi
            GOOS="$target" go build -trimpath -ldflags="-s -w -X main.version=$version" -o "dist/$binary" .
            python3 scripts/package.py --binary "dist/$binary" --version "$version" --os "$target" --arch "$GOARCH"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sshore-amd64
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sshore-amd64
          path: packages
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh
