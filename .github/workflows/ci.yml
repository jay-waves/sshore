# Build Linux/Windows amd64 on pushes and PRs; publish main after both builds.
# Published tags run the reusable Tests pipeline explicitly (token-created tags
# do not trigger another push workflow).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (Linux + Windows amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build and package
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          for target in linux windows; do
            binary=sshore
            if [[ "$target" == windows ]]; then binary=sshore.exe; fi
            GOOS="$target" go build -trimpath -ldflags="-s -w -X main.version=$version" -o "dist/$binary" .
            python3 scripts/package.py --binary "dist/$binary" --version "$version" --os "$target" --arch "$GOARCH"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sshore-amd64
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sshore-amd64
          path: packages
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh
      - name: Identify published tag
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(cat VERSION)"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
          if [[ -z "$existing" ]]; then exit 0; fi
          commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
          if [[ "$commit" == "$GITHUB_SHA" ]]; then
            gh release view "$tag" --repo "$GH_REPO" > /dev/null
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  test-release:
    name: Validate published tag
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
