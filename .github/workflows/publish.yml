name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build tagged packages
        run: |
          test "$GITHUB_REF_NAME" != v0.0.0
          go run ./scripts "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest \
            --title "sshore $GITHUB_REF_NAME" \
            "packages/sshore_${version}_linux_amd64.tar.gz" \
            "packages/sshore_${version}_windows_amd64.zip" packages/SHA256SUMS
