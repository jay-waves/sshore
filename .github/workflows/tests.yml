# Validation is independent of builds and publication.
name: Tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tests.yml
      - tests/integration/**
      - tests/install_windows_test.ps1
  workflow_dispatch:
    inputs:
      ref:
        description: Optional release tag or commit (defaults to selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Core unit tests
        run: go run ./scripts go test ./...

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Installer on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/install_windows_test.ps1
      - name: Installer on PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/install_windows_test.ps1
      - name: Build the Windows client and Linux fixture
        if: ${{ !cancelled() }}
        id: builds
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $driver = Join-Path $env:RUNNER_TEMP sshore-build.exe
          $env:SSHORE_TEST_WINDOWS_CLIENT = Join-Path $env:RUNNER_TEMP sshore.exe
          $fixture = Join-Path $env:RUNNER_TEMP sshore-wsl
          New-Item -ItemType Directory -Path $fixture | Out-Null
          "SSHORE_TEST_WINDOWS_CLIENT=$env:SSHORE_TEST_WINDOWS_CLIENT" >> $env:GITHUB_ENV
          "SSHORE_TEST_WSL_ARTIFACTS=$fixture" >> $env:GITHUB_ENV
          go build -o $driver ./scripts
          & $driver go build -ldflags '-X main.version=0.0.0' -o $env:SSHORE_TEST_WINDOWS_CLIENT .
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          & $driver go build -ldflags '-X main.version=0.0.0' -o (Join-Path $fixture sshore) .
          & $driver go build -ldflags '-X main.version=0.0.1' -o (Join-Path $fixture sshore-other) .
          go test -tags=integration -c -o (Join-Path $fixture integration.test) ./tests/integration
      - name: Windows ConPTY integration
        if: ${{ !cancelled() && steps.builds.outcome == 'success' }}
        run: go test -tags=integration -count=1 -timeout=90s -run '^TestWindowsConPTY$' -v ./tests/integration
      - name: Install WinFsp and prepare its official test suite
        if: ${{ !cancelled() && steps.builds.outcome == 'success' }}
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP winfsp-2.2.26323.msi
          $log = Join-Path $env:RUNNER_TEMP winfsp-install.log
          Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.2/winfsp-2.2.26323.msi -OutFile $msi
          if ((Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash -ne '36CE01F9EEDBBE6842B7FB4BEDC79D7D4F71983E8ACEB6877B46A07B331C7E19') {
              throw 'WinFsp installer checksum mismatch'
          }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"{0}"' -f $msi), '/qn', '/norestart', '/L*v', ('"{0}"' -f $log)) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
              Get-Content -LiteralPath $log -Tail 80
              throw "WinFsp installer exited with $($install.ExitCode)"
          }
          $suite = Join-Path $env:RUNNER_TEMP winfsp-tests-2.2.26323.zip
          Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.2/winfsp-tests-2.2.26323.zip -OutFile $suite
          if ((Get-FileHash -LiteralPath $suite -Algorithm SHA256).Hash -ne '17BDAE984B2683F9A6E37D3B2D394C7FBD71CB9295C4B450370641648A8A0276') {
              throw 'WinFsp test suite checksum mismatch'
          }
          $suiteDir = Join-Path $env:RUNNER_TEMP winfsp-tests
          Expand-Archive -LiteralPath $suite -DestinationPath $suiteDir
          (Join-Path ${env:ProgramFiles(x86)} 'WinFsp\bin') >> $env:GITHUB_PATH
          "SSHORE_TEST_WINFSP_SUITE=$(Join-Path $suiteDir winfsp-tests-x64.exe)" >> $env:GITHUB_ENV
      - name: Set up Ubuntu WSL for integration tests
        if: ${{ !cancelled() && steps.builds.outcome == 'success' }}
        id: wsl
        uses: Vampire/setup-wsl@f40fb59d850112c9a292b0218bca8271305b9127 # v5.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: openssh-server procps fuse3
      - name: Windows and WSL integration
        if: ${{ !cancelled() && steps.wsl.outcome == 'success' }}
        run: go test -tags=integration -count=1 -timeout=150s -run '^TestWindowsWSL$' -v ./tests/integration
