# Full validation is opt-in; builds and publication never invoke it.
name: Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional release tag or commit (defaults to selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Verify release identity and toolchain
        shell: bash
        env:
          TEST_REF: ${{ inputs.ref || github.ref }}
        run: |
          command -v go python3 bash
          go version
          python3 --version
          if [[ "$TEST_REF" == refs/tags/* || "$TEST_REF" == v* ]]; then
            tag=${TEST_REF#refs/tags/}
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$tag" = "v$(cat VERSION)"
          fi
          git rev-parse HEAD
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bash zsh fish openssh-client openssh-sftp-server
          command -v bash zsh fish ssh ssh-keygen
          bash --version
          zsh --version
          fish --version
      - name: Formatting
        shell: bash
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: go vet ./...
      - name: Linux Go tests with race detector
        if: runner.os == 'Linux'
        env:
          GOFLAGS: -race
        run: go test -json -count=1 -timeout=10m ./... > core-tests.jsonl
      - name: Windows build and platform compatibility
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build ./...
          go test -run '^(TestLocalShellPath|TestWindowsPlatform|TestMountDaemonHasNoConsole|TestWindowsPrivateStateHandle)$' .
      - name: Installer and release tests (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          sh -n install.sh
          bash -n scripts/release.sh
          python3 tests/install_test.py
          python3 tests/release_test.py
      - name: Installer tests (Windows PowerShell 5.1)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: ./tests/install_windows_test.ps1
      - name: Installer tests (PowerShell 7)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./tests/install_windows_test.ps1
      - name: All real SSH scenarios (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: tests/integration/ssh_docker.sh
      - name: Show failed and skipped Go tests
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          python3 -X utf8 - <<'PY'
          import json, os
          from pathlib import Path
          log = Path('core-tests.jsonl')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Go test failures and skips\n\n')
              if not log.exists():
                  summary.write('Core test log unavailable; check preceding steps.\n')
              else:
                  for line in log.read_text(encoding='utf-8-sig').splitlines():
                      event = json.loads(line)
                      if event['Action'] in ('fail', 'skip'):
                          summary.write(f"- {event['Action']}: {event['Package']} {event.get('Test', '')}\n")
                      if event['Action'] == 'output':
                          print(event['Output'], end='')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && runner.os == 'Linux' }}
        with:
          name: test-results-${{ matrix.os }}
          path: core-tests.jsonl
          if-no-files-found: warn
