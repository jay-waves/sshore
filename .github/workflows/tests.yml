# Validation is independent of builds and publication.
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional release tag or commit (defaults to selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Core unit tests
        run: go run ./scripts go test ./...
      - name: Alpine OpenSSH and FUSE integration
        if: ${{ !cancelled() }}
        run: tests/integration/ssh_docker.sh

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Installer on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/install_windows_test.ps1
      - name: Installer on PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/install_windows_test.ps1
      - name: Build the Windows client
        if: ${{ !cancelled() }}
        id: build
        shell: pwsh
        run: |
          $env:SSHORE_TEST_WINDOWS_CLIENT = Join-Path $env:RUNNER_TEMP sshore.exe
          "SSHORE_TEST_WINDOWS_CLIENT=$env:SSHORE_TEST_WINDOWS_CLIENT" >> $env:GITHUB_ENV
          go run ./scripts go build -ldflags '-X main.version=0.0.0' -o $env:SSHORE_TEST_WINDOWS_CLIENT .
      - name: Windows ConPTY regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: go test -tags=integration -count=1 -timeout=90s -run '^TestWindowsConPTY$' -v ./tests/integration
