# Full validation is opt-in; builds and publication never invoke it.
name: Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional release tag or commit (defaults to selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Verify release identity and toolchain
        shell: bash
        env:
          TEST_REF: ${{ inputs.ref || github.ref }}
        run: |
          command -v go bash
          go version
          if [[ "$TEST_REF" == refs/tags/* || "$TEST_REF" == v* ]]; then
            tag=${TEST_REF#refs/tags/}
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$tag" != v0.0.0 ]]
          fi
          git rev-parse HEAD
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bash zsh fish openssh-client
          command -v bash zsh fish ssh ssh-keygen
          bash --version
          zsh --version
          fish --version
      - name: Formatting
        shell: bash
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: go vet ./...
      - name: Linux Go tests with race detector
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOFLAGS: -race
        run: go test -json -count=1 -timeout=10m ./... | tee core-tests.jsonl
      - name: Windows build and platform compatibility
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build ./...
          go test -run '^(TestScripts|TestLocalShellPath|TestWindowsPlatform|TestMountDaemonHasNoConsole|TestWindowsPrivateStateHandle)$' .
      - name: Installer tests (Windows PowerShell 5.1)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: ./tests/install_windows_test.ps1
      - name: Installer tests (PowerShell 7)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./tests/install_windows_test.ps1
      - name: Real SSH Go integration test (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: tests/integration/ssh_docker.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() && runner.os == 'Linux' }}
        with:
          name: test-results-${{ matrix.os }}
          path: core-tests.jsonl
          if-no-files-found: warn
